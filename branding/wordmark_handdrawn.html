<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bistro Steward — Handdrawn Wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Homemade+Apple&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --bg-2: #181612;
    --ink: #f4ead5;          /* warm cream */
    --ink-dim: #a89f8a;
    --accent: #e8a04a;       /* roasted amber */
    --accent-2: #6b8e4e;     /* herb green */
    --line: #2b2820;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; }
  body { min-height: 100vh; padding: 64px 48px; display: flex; flex-direction: column; gap: 56px; }

  .stage {
    background:
      radial-gradient(ellipse at center, #1a1814 0%, #0f1117 75%);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 96px 48px 80px;
    text-align: center;
    position: relative;
  }
  .stage::after {
    content: '';
    position: absolute; inset: 16px;
    border: 1px dashed rgba(232,160,74,0.15);
    border-radius: 8px;
    pointer-events: none;
  }
  .wordmark {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 144px;
    line-height: 0.95;
    color: var(--ink);
    transform: rotate(-2deg);
    display: inline-block;
  }
  .wordmark .stew { color: var(--accent); }
  .underline {
    display: block;
    margin: 8px auto 0;
    width: 280px;
    height: 14px;
  }
  .tagline {
    font-family: 'Kalam', cursive;
    font-weight: 400;
    font-size: 20px;
    color: var(--ink-dim);
    margin-top: 32px;
    letter-spacing: 0.04em;
  }
  .tagline .amp { color: var(--accent-2); font-weight: 700; }

  .alt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .alt {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 48px 32px;
    text-align: center;
  }
  .alt h3 {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 24px;
    font-weight: 500;
  }
  .alt .wordmark { font-size: 64px; }
  .alt .tagline { font-size: 14px; margin-top: 16px; }

  .palette { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .swatch {
    width: 88px;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  .swatch .chip { height: 72px; }
  .swatch .meta { padding: 8px; background: var(--bg-2); font-size: 10px; }
  .swatch .meta .name { color: var(--ink); font-weight: 500; }
  .swatch .meta .hex { color: var(--ink-dim); margin-top: 2px; }
  .section-label {
    font-family: 'Kalam', cursive;
    font-size: 18px;
    color: var(--ink-dim);
    text-align: center;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="wordmark">
      Bistro <span class="stew">Steward</span>
      <svg class="underline" viewBox="0 0 280 14" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M4,8 Q70,2 140,7 T276,6" fill="none" stroke="#e8a04a" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="tagline">Restaurant Inventory <span class="amp">&amp;</span> Recipe Costing</div>
  </div>

  <div class="alt-row">
    <div class="alt">
      <h3>Kalam · Marker</h3>
      <div class="wordmark" style="font-family:'Kalam',cursive; font-weight:700; transform:rotate(-1deg);">Bistro Steward</div>
      <div class="tagline">from kitchen to spreadsheet</div>
    </div>
    <div class="alt">
      <h3>Homemade Apple · Chef's Hand</h3>
      <div class="wordmark" style="font-family:'Homemade Apple',cursive; font-size:42px; line-height:1.4; transform:rotate(-2deg);">Bistro<br>Steward</div>
      <div class="tagline">a chef's ledger</div>
    </div>
  </div>

  <div>
    <div class="section-label">— palette · warm pantry —</div>
    <div class="palette">
      <div class="swatch"><div class="chip" style="background:#0f1117;"></div><div class="meta"><div class="name">Ink</div><div class="hex">#0F1117</div></div></div>
      <div class="swatch"><div class="chip" style="background:#f4ead5;"></div><div class="meta"><div class="name">Cream</div><div class="hex">#F4EAD5</div></div></div>
      <div class="swatch"><div class="chip" style="background:#e8a04a;"></div><div class="meta"><div class="name">Amber</div><div class="hex">#E8A04A</div></div></div>
      <div class="swatch"><div class="chip" style="background:#6b8e4e;"></div><div class="meta"><div class="name">Herb</div><div class="hex">#6B8E4E</div></div></div>
      <div class="swatch"><div class="chip" style="background:#a13e2c;"></div><div class="meta"><div class="name">Tomato</div><div class="hex">#A13E2C</div></div></div>
      <div class="swatch"><div class="chip" style="background:#a89f8a;"></div><div class="meta"><div class="name">Parchment</div><div class="hex">#A89F8A</div></div></div>
    </div>
  </div>

</body>
</html>
